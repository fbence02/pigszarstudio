<!doctype html>
<html lang="hu">

<head>
  <meta charset="UTF-8" />
  <title>F1 P2P RACING - CUSTOM EDITION</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/settings.css" />
</head>

<body>
  <div id="ui-layer">
    <div class="menu" id="mainMenu">
      <h1>F1 MULTIPLAYER</h1>
      <p style="margin-bottom: 30px; color: #aaa;">Válaszd meg az opciót!</p>

      <button id="btnCreateLobby" class="primary-btn">Szerver Indítása (Host)</button>
      <div class="divider">VAGY</div>
      <button id="btnJoinLobby" class="secondary-btn">Csatlakozás Szobához</button>

      <div style="margin-top: 40px; border-top: 1px solid #444; padding-top: 20px;">
        <button id="btnTrackEditor" class="secondary-btn" style="font-size: 14px;">
          Pályaszerkesztő
        </button>
      </div>

      <div id="status" class="status-msg"></div>
    </div>
  </div>

  <script>
    document.getElementById('btnCreateLobby').onclick = () => {
      window.location.href = './lobby.html';
    };

    document.getElementById('btnJoinLobby').onclick = () => {
      window.location.href = './join-lobby.html';
    };

    document.getElementById('btnTrackEditor').onclick = () => {
      window.location.href = './trackeditor.html';
    };
  </script>
  <script src="assets/js/settings.js"></script>
</body>

</html>
