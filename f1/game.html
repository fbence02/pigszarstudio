<!doctype html>
<html lang="hu">

<head>
  <meta charset="UTF-8" />
  <title>F1 P2P RACING - GAME</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/settings.css" />
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>

<body>
  <div id="leaderboard"
    style="position: absolute; top: 20px; left: 20px; width: 320px; max-height: calc(100vh - 40px); overflow-y: auto; background: rgba(0, 0, 0, 0.75); border: 1px solid #333; border-radius: 16px; padding: 16px; color: #fff; font-family: sans-serif; z-index: 15;">
    <div style="font-size: 18px; font-weight: bold; margin-bottom: 12px; letter-spacing: 0.5px;">Leaderboard</div>
    <!-- Leaderboard will be populated here -->
  </div>

  <div id="raceCountdown"
    style="display: none; position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 25; pointer-events: none; width: auto;">
    <div
      style="display: inline-flex; flex-direction: column; align-items: center; gap: 18px; background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(8px); border-radius: 18px; padding: 14px 18px;">
      <div id="countdownLights" style="display: flex; gap: 14px;">
        <div class="countdown-light"
          style="width: 36px; height: 36px; border-radius: 50%; background: #300; box-shadow: inset 0 0 12px rgba(255,0,0,0.08);">
        </div>
        <div class="countdown-light"
          style="width: 36px; height: 36px; border-radius: 50%; background: #300; box-shadow: inset 0 0 12px rgba(255,0,0,0.08);">
        </div>
        <div class="countdown-light"
          style="width: 36px; height: 36px; border-radius: 50%; background: #300; box-shadow: inset 0 0 12px rgba(255,0,0,0.08);">
        </div>
      </div>
      <div id="countdownText"
        style="font-size: 62px; font-weight: 900; color: #fff; letter-spacing: 0.12em; text-shadow: 0 0 18px rgba(255,255,255,0.2);">
        3</div>
    </div>
  </div>

  <div id="lapTimeBoard"
    style="position: absolute; top: 20px; right: 20px; width: 280px; max-height: calc(100vh - 40px); overflow-y: auto; background: rgba(0, 0, 0, 0.7); border: 1px solid #444; border-radius: 16px; padding: 14px; color: #fff; font-family: sans-serif; z-index: 15;">
    <div style="font-size: 16px; font-weight: bold; margin-bottom: 10px; letter-spacing: 0.5px;">Lap time list</div>
    <div id="lapTimeList" style="display: flex; flex-direction: column; gap: 8px;"></div>
  </div>

  <div id="hud" style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 15;">
    <div
      style="text-align: center; background: rgba(0, 0, 0, 0.8); border: 1px solid #444; border-radius: 16px; padding: 14px; color: #fff; font-family: sans-serif;">
      Sebesség: <span id="speedVal">0</span> km/h <span style="color:#666; margin: 0 10px;">|</span> Fokozat: <span
        id="gearVal" style="color:#e10600; font-size: 32px; font-weight: 900;">1</span> <span
        style="color:#666; margin: 0 10px;">|</span> Kör: <span id="lapVal"
        style="color:#0ff; font-size: 32px; font-weight: 900;">1</span>/<span id="totalLapsVal">3</span>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script src="assets/js/settings.js"></script>
  <script src="assets/js/audio.js"></script>
  <script src="assets/js/physics.js"></script>
  <script src="assets/js/render.js"></script>
  <script src="assets/js/game.js"></script>
</body>

</html>
