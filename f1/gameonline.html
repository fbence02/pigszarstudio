<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>F1 P2P RACING - PRO EDITION</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #2b5c23; overflow: hidden; font-family: 'Arial', sans-serif; user-select: none; }
        canvas { display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.8); z-index: 10; }
        .menu { background: #111; color: #fff; padding: 40px; text-align: center; border-radius: 10px; max-width: 450px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); border-top: 10px solid #e10600; }
        h1 { margin-top: 0; font-size: 36px; color: #fff; font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #aaa; }
        button { background: #e10600; color: #fff; border: none; padding: 15px 30px; font-size: 18px; margin: 10px; cursor: pointer; text-transform: uppercase; font-weight: bold; border-radius: 5px; transition: 0.2s; width: 80%; }
        button:hover { background: #ff1a12; transform: scale(1.05); }
        input { background: #222; border: 2px solid #555; color: #fff; padding: 15px; font-size: 24px; text-align: center; width: 60%; text-transform: uppercase; outline: none; margin-bottom: 10px; border-radius: 5px; }
        input:focus { border-color: #e10600; }
        #hud { position: absolute; top: 20px; left: 20px; z-index: 5; display: none; color: white; text-shadow: 2px 2px 0 #000; font-size: 28px; font-weight: bold; font-style: italic; pointer-events: none; }
        .code-display { font-size: 48px; color: #e10600; margin: 20px 0; font-weight: 900; letter-spacing: 5px; background: #222; padding: 10px; border-radius: 10px;}
        .player-count { font-size: 16px; color: #0f0; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="hud">
        Sebesség: <span id="speedVal">0</span> km/h<br>
        <span style="font-size: 18px; color: #aaa;">Max 10 játékos</span>
    </div>

    <div id="ui-layer">
        <div class="menu" id="mainMenu">
            <h1>F1 MULTIPLAYER</h1>
            <p>10 Fős Bajnokság (Hanggal & Fizikával)</p>
            <button id="btnHost">Szerver Indítása (Host)</button>
            <div style="margin: 20px 0; color: #666; font-weight: bold;">VAGY CSATLAKOZZ</div>
            <input type="text" id="joinCode" maxlength="5" placeholder="5 BETŰS KÓD">
            <br>
            <button id="btnJoin" style="background: #333; border: 2px solid #555;">Csatlakozás</button>
            <div id="status" style="margin-top: 20px; font-weight: bold; color: #e10600;"></div>
        </div>

        <div class="menu" id="hostMenu" style="display: none;">
            <h1>BOXUTCA...</h1>
            <p>Küldd el a kódot a többieknek (Max 9 másik ember):</p>
            <div class="code-display" id="myCode">---</div>
            <div class="player-count" id="playerCount">Játékosok: 1/10</div>
            <button id="btnStartRace" style="margin-top: 20px;">Verseny Indítása</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize); resize();

    // --- HANG MOTOR (Web Audio API) ---
    let audioCtx, engineOsc, engineGain;
    function initAudio() {
        if(audioCtx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        
        // Motorhang generátor
        engineOsc = audioCtx.createOscillator();
        engineGain = audioCtx.createGain();
        engineOsc.type = 'sawtooth';
        engineOsc.frequency.value = 40; // Alapjárati hang
        engineGain.gain.value = 0; // Kezdetben néma
        engineOsc.connect(engineGain);
        engineGain.connect(audioCtx.destination);
        engineOsc.start();
    }

    function updateAudio(speed) {
        if(!audioCtx) return;
        let absSpeed = Math.abs(speed);
        // Hangmagasság és hangerő változik a sebességgel
        engineOsc.frequency.setTargetAtTime(40 + absSpeed * 4, audioCtx.currentTime, 0.1);
        engineGain.gain.setTargetAtTime(absSpeed > 1 ? 0.08 : 0.02, audioCtx.currentTime, 0.1);
    }

    function playCrashSound() {
        if(!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    }

    // --- HÁLÓZAT & JÁTÉKOSOK ---
    const prefix = "F1PRO-";
    const genCode = () => Math.random().toString(36).substring(2, 7).toUpperCase();
    let myId = genCode();
    let peer = null, isHost = false, gameActive = false;
    let hostConn = null; // Ha kliens vagyok, ez a kapcsolat a hosthoz
    
    // 10 F1 stílusú szín
    const carColors = ['#e10600', '#005aff', '#00d2be', '#ff8700', '#006f62', '#fff500', '#900000', '#0082fa', '#ffffff', '#002244'];
    
    // Központi játékállapot
    const MAX_PLAYERS = 10;
    let clients = {}; // Hostnak: csatlakozások
    let gameData = {}; // Összes játékos adata: id -> {x, y, angle, color}
    
    const player = { x: 0, y: 0, angle: 0, speed: 0, maxSpeed: 38, accel: 0.5, friction: 0.98, turnSpeed: 0.03, color: carColors[0] };

    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
    window.addEventListener('keydown', e => { if (keys.hasOwnProperty(e.code)) keys[e.code] = true; });
    window.addEventListener('keyup', e => { if (keys.hasOwnProperty(e.code)) keys[e.code] = false; });

    // --- PÁLYA DEFINÍCIÓ ---
    const trackWidth = 350;
    const track = [
        {x: 0, y: 0}, {x: 2000, y: 0}, {x: 2800, y: 800}, {x: 2800, y: 1800}, 
        {x: 2000, y: 2600}, {x: 1000, y: 2600}, {x: 500, y: 2000}, {x: 1000, y: 1500},
        {x: 500, y: 1000}, {x: -500, y: 1000}, {x: -1000, y: 500}, {x: 0, y: 0}
    ];

    // Hálózati inicializálás
    function initPeer(id) {
        peer = new Peer(prefix + id);
        
        peer.on('open', () => { 
            if(isHost) document.getElementById('myCode').innerText = id; 
        });

        // Csak a HOST fogadja a bejövő kapcsolatokat
        peer.on('connection', (c) => {
            if (!isHost) return;
            
            if (Object.keys(clients).length >= MAX_PLAYERS - 1) {
                c.on('open', () => { c.send({ type: 'full' }); setTimeout(()=>c.close(), 500); });
                return;
            }

            c.on('open', () => {
                clients[c.peer] = c;
                let newColor = carColors[Object.keys(clients).length % carColors.length];
                gameData[c.peer] = { x: 0, y: 0, angle: 0, color: newColor };
                
                document.getElementById('playerCount').innerText = `Játékosok: ${Object.keys(clients).length + 1}/${MAX_PLAYERS}`;
                
                // Elküldjük neki a saját színét
                c.send({ type: 'init', color: newColor });
                
                // Ha már megy a játék, bedobjuk
                if(gameActive) c.send({ type: 'start' });
            });

            c.on('data', (data) => {
                if (data.type === 'sync' && gameData[c.peer]) {
                    gameData[c.peer].x = data.x;
                    gameData[c.peer].y = data.y;
                    gameData[c.peer].angle = data.angle;
                }
            });

            c.on('close', () => {
                delete clients[c.peer];
                delete gameData[c.peer];
                if(!gameActive) document.getElementById('playerCount').innerText = `Játékosok: ${Object.keys(clients).length + 1}/${MAX_PLAYERS}`;
            });
        });

        peer.on('error', (err) => { document.getElementById('status').innerText = "Hiba: " + err.type; });
    }

    // Host Gomb
    document.getElementById('btnHost').onclick = () => { 
        initAudio(); // Hang indítása
        isHost = true; 
        document.getElementById('mainMenu').style.display = 'none'; 
        document.getElementById('hostMenu').style.display = 'block'; 
        gameData[myId] = {x: 0, y: 0, angle: 0, color: player.color}; // Host regisztrálása
        initPeer(myId); 
    };

    // Host Indítja a versenyt
    document.getElementById('btnStartRace').onclick = () => {
        for(let id in clients) clients[id].send({ type: 'start' });
        startGame();
    };

    // Kliens Csatlakozás Gomb
    document.getElementById('btnJoin').onclick = () => {
        initAudio(); // Hang indítása
        const code = document.getElementById('joinCode').value.toUpperCase().trim();
        if (code.length !== 5) return document.getElementById('status').innerText = "Hibás kód!";
        isHost = false; 
        document.getElementById('status').innerText = "Csatlakozás szerverhez...";
        initPeer(genCode());

        setTimeout(() => { 
            hostConn = peer.connect(prefix + code); 
            hostConn.on('open', () => { document.getElementById('status').innerText = "Várakozás a Hostra..."; });
            hostConn.on('data', (data) => {
                if (data.type === 'full') { alert("A szerver tele van (max 10 fő)!"); location.reload(); }
                if (data.type === 'init') { player.color = data.color; }
                if (data.type === 'start') { startGame(); }
                if (data.type === 'state') {
                    // Szerver küldi mindenki pozícióját
                    for (let id in data.players) {
                        if (id !== myId) gameData[id] = data.players[id];
                    }
                    // Töröljük aki kilépett
                    for (let id in gameData) {
                        if (!data.players[id] && id !== myId) delete gameData[id];
                    }
                }
            });
        }, 1000);
    };

    function startGame() {
        document.getElementById('ui-layer').style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        gameActive = true;
        
        // Host szinkronizációs hurok (Szétküldi mindenkinek az állást 20x másodpercenként)
        if (isHost) {
            setInterval(() => {
                gameData[myId].x = player.x; gameData[myId].y = player.y; gameData[myId].angle = player.angle;
                for(let id in clients) clients[id].send({ type: 'state', players: gameData });
            }, 50);
        } else {
            // Kliens szinkronizációs hurok (Küldi a Hostnak a saját pozícióját)
            setInterval(() => {
                if (hostConn && hostConn.open) hostConn.send({ type: 'sync', x: player.x, y: player.y, angle: player.angle });
            }, 50);
        }

        requestAnimationFrame(gameLoop);
    }

    // --- FIZIKA ÉS ÜTKÖZÉS ---
    
    // Visszaadja a normál vektort, ha az autó falnak ütközött, különben null
    function checkWallCollision(p) {
        let minDist = Infinity;
        let collisionNormal = null;
        
        for (let i = 0; i < track.length - 1; i++) {
            let v = track[i], w = track[i+1];
            let l2 = (w.x - v.x)**2 + (w.y - v.y)**2;
            let t = l2 === 0 ? 0 : ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
            t = Math.max(0, Math.min(1, t)); // Szakaszra vetítés
            
            let cx = v.x + t * (w.x - v.x);
            let cy = v.y + t * (w.y - v.y);
            
            let dx = p.x - cx;
            let dy = p.y - cy;
            let dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < minDist) {
                minDist = dist;
                // A vektor a pályaközéppont felé mutat (befelé)
                collisionNormal = { x: -dx/dist, y: -dy/dist }; 
            }
        }
        
        // Ha a távolság nagyobb, mint a fél pálya mínusz a kocsi fele, akkor ütköztünk
        if (minDist > (trackWidth / 2) - 20) {
            return collisionNormal;
        }
        return null;
    }

    let lastCrashTime = 0;

    function updatePhysics() {
        if (keys.ArrowUp) player.speed += player.accel;
        if (keys.ArrowDown) player.speed -= player.accel * 1.5;

        player.speed *= player.friction;

        // Kormányzás (Kevésbé érzékeny, simább)
        if (Math.abs(player.speed) > 1) {
            let turnDir = player.speed > 0 ? 1 : -1;
            // A kanyarodás finomodik, ahogy nő a sebesség (leszorítóerő imitáció)
            let currentTurnSpeed = player.turnSpeed * (1 - (Math.abs(player.speed) / player.maxSpeed) * 0.2);
            if (keys.ArrowLeft) player.angle -= currentTurnSpeed * turnDir;
            if (keys.ArrowRight) player.angle += currentTurnSpeed * turnDir;
        }

        player.x += Math.cos(player.angle) * player.speed;
        player.y += Math.sin(player.angle) * player.speed;

        // Fali ütközés vizsgálata
        let hitNormal = checkWallCollision(player);
        if (hitNormal) {
            // Visszapattanás és sebességvesztés
            player.speed *= 0.3; // Kemény fékezés a fal adta sokktól
            
            // Visszatoljuk az autót a pálya közepe felé, hogy ne ragadjon be a falba
            player.x += hitNormal.x * 10;
            player.y += hitNormal.y * 10;
            
            // Csak akkor játszunk le hangot, ha gyorsan mentünk és telt el elég idő az előző óta
            if (Math.abs(player.speed) > 2 && Date.now() - lastCrashTime > 300) {
                playCrashSound();
                lastCrashTime = Date.now();
            }
        }

        if (player.speed > player.maxSpeed) player.speed = player.maxSpeed;
        if (player.speed < -player.maxSpeed/3) player.speed = -player.maxSpeed/3;

        updateAudio(player.speed); // Motorhang frissítése
    }

    // --- RENDERELÉS ---

    function drawF1Car(ctx, x, y, angle, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        
        ctx.fillStyle = '#111'; // Kerekek
        ctx.fillRect(15, -22, 15, 8); ctx.fillRect(15, 14, 15, 8); 
        ctx.fillRect(-25, -22, 15, 10); ctx.fillRect(-25, 12, 15, 10);

        ctx.fillStyle = color; // Kasztni
        ctx.beginPath();
        ctx.moveTo(35, -5); ctx.lineTo(35, 5); 
        ctx.lineTo(10, 10); ctx.lineTo(-20, 12); 
        ctx.lineTo(-35, 8); ctx.lineTo(-35, -8); 
        ctx.lineTo(-20, -12); ctx.lineTo(10, -10); 
        ctx.fill();

        ctx.fillStyle = '#222'; // Szárnyak
        ctx.fillRect(25, -18, 8, 36);
        ctx.fillRect(-40, -18, 10, 36);

        ctx.fillStyle = '#000'; // Bukósisak
        ctx.beginPath(); ctx.arc(-5, 0, 6, 0, Math.PI * 2); ctx.fill();

        ctx.restore();
    }

    function drawCircuit() {
        ctx.lineJoin = 'round'; ctx.lineCap = 'round';

        // 1. Fehér alap a rázóköveknek
        ctx.beginPath(); ctx.moveTo(track[0].x, track[0].y);
        for(let i=1; i<track.length; i++) ctx.lineTo(track[i].x, track[i].y);
        ctx.lineWidth = trackWidth + 30; ctx.strokeStyle = '#fff'; ctx.stroke();

        // 2. Piros rázókő
        ctx.beginPath(); ctx.moveTo(track[0].x, track[0].y);
        for(let i=1; i<track.length; i++) ctx.lineTo(track[i].x, track[i].y);
        ctx.lineWidth = trackWidth + 30; ctx.strokeStyle = '#e10600';
        ctx.setLineDash([60, 60]); ctx.stroke(); ctx.setLineDash([]);

        // 3. Aszfalt
        ctx.beginPath(); ctx.moveTo(track[0].x, track[0].y);
        for(let i=1; i<track.length; i++) ctx.lineTo(track[i].x, track[i].y);
        ctx.lineWidth = trackWidth; ctx.strokeStyle = '#444'; ctx.stroke();

        // 4. Start/Cél Vonal
        ctx.save();
        ctx.translate(track[0].x, track[0].y);
        let dx = track[1].x - track[0].x; let dy = track[1].y - track[0].y;
        ctx.rotate(Math.atan2(dy, dx));
        ctx.fillStyle = '#fff';
        for(let i = -trackWidth/2; i < trackWidth/2; i += 20) {
            ctx.fillRect(0, i, 10, 10); ctx.fillRect(10, i+10, 10, 10);
        }
        ctx.restore();
    }

    function gameLoop() {
        if (!gameActive) return;
        requestAnimationFrame(gameLoop);

        updatePhysics();
        document.getElementById('speedVal').innerText = Math.abs(Math.round(player.speed * 10));

        ctx.fillStyle = '#2b5c23'; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(canvas.width / 2 - player.x, canvas.height / 2 - player.y);

        drawCircuit();

        // Többi játékos rajzolása (kivéve saját magunk, mert azt utoljára rajzoljuk a tetejére)
        for (let id in gameData) {
            if (id !== myId) {
                let p = gameData[id];
                drawF1Car(ctx, p.x, p.y, p.angle, p.color);
            }
        }

        // Saját autó rajzolása
        drawF1Car(ctx, player.x, player.y, player.angle, player.color);

        ctx.restore();
    }
</script>
</body>
</html>
