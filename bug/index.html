<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fly Infection Rush</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="main-menu" class="screen active">
    <h1>Fly Infection Rush</h1>
    <p>Singleplayer browser arcade.</p>
    <p>Infect as much food as possible before your stamina runs out.</p>
    <div class="controls">
      <div>
        <strong>Controls:</strong><br />WASD to move, F to dash
      </div>
    </div>
    <button id="start-button">Start Game</button>
  </div>

  <div id="game-screen" class="screen">
    <div class="hud">
      <div class="panel">
        <h2>Player</h2>
        <div>Score: <span id="score1">0</span></div>
        <div>Stamina: <span id="stamina1">100</span>%</div>
      </div>
      <button id="restart-button">Restart</button>
    </div>
    <canvas id="game-canvas" width="900" height="600"></canvas>
  </div>

  <div id="gameover-screen" class="screen">
    <h1>Game Over</h1>
    <p id="gameover-text"></p>
    <button id="menu-button">Back to Menu</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
